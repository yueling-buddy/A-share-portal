name: A-share Intraday Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "mode: bootstrap | intraday | close（留空则由北京时间自动判定：15:00-15:30 视为 close）"
        type: string
        required: false
  # 推送到 main 时立即刷新一次（cron 停摆时用于补数据；bot 自身的 push 不会递归触发）
  push:
    branches: [main]
  # 定时刷新时间表（北京时间，周一至周五，2026-09-08 调整）：
  #   09:00 / 09:15 取消（盘前守卫丢弃，刷新无意义）
  #   09:25 集合竞价撮合 → 抓 auction_price/auction_pct（独立写 data/auction.json，并临时覆盖 rps.json pct_change）
  #   09:30-11:45 每 15 分钟 / 09:32 开盘后硬刷新 / 13:00-14:45 每 15 分钟 / 15:10 收盘定稿
  # 2026-09-03：GitHub cron 调度队列停止触发（10:19 后不再自动跑），改为显式 cron 条目重新注册 schedule。
  schedule:
    # 上午 09:30-11:45（UTC 01:30-03:45；9:00/9:15 已取消，见上方注释）
    # 09:25 集合竞价撮合 → 抓 auction
    - cron: "25 1 * * 1-5"
    - cron: "30 1 * * 1-5"
    - cron: "45 1 * * 1-5"
    - cron: "0 2 * * 1-5"
    - cron: "15 2 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "45 2 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "15 3 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "45 3 * * 1-5"
    # 09:32 开盘 2 分钟后硬刷新
    - cron: "32 1 * * 1-5"
    # 下午 13:00-14:45（UTC 05:00-06:45）
    - cron: "0 5 * * 1-5"
    - cron: "15 5 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "15 6 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "45 6 * * 1-5"
    # 15:10 收盘定稿
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore K-line cache
        id: cache
        uses: actions/cache@v4
        with:
          path: data/kline_cache.parquet
          key: kline-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kline-v2-

      - name: Seed cache if missing
        run: |
          if [ ! -f data/kline_cache.parquet ]; then
            echo "Cache missing, restoring from seed"
            cp data/kline_cache_seed.parquet data/kline_cache.parquet
          fi

      - name: Determine mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            export TZ=Asia/Shanghai
            H=$(date +%H)
            M=$(date +%M)
            if [ "$H" = "09" ] && [ "$M" -ge 20 ] && [ "$M" -lt 30 ]; then
              MODE=auction
            elif [ "$H" = "15" ] && [ "$M" -le 30 ]; then
              MODE=close
            else
              MODE=intraday
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE"

      - name: Refresh data
        run: python scripts/refresh.py --mode ${{ steps.mode.outputs.mode }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 主数据文件：每次必 add
          git add index.html data/rps.json data/history.json data/fip.json data/meta.json data/sector_rps.json data/sector_rps_history.json data/cloud_run_log.json
          # 竞价文件：只有 9:25 auction 模式才生成；intraday/close 模式 checkout 时可能还不存在，用 || true 容错
          git add data/auction.json 2>/dev/null || true
          # 无改动时跳过 commit + push（避免 cron 空转占 token 配额 + 误导失败信号）
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "auto: ${{ steps.mode.outputs.mode }} refresh $(TZ=Asia/Shanghai date +%F_%H:%M)"
            git push
          fi
