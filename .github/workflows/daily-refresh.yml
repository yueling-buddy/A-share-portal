name: A-share Intraday Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "mode: bootstrap | intraday | close"
        type: string
        required: false
        default: "intraday"
  schedule:
    - cron: "*/15 1-3 * * 1-5"   # 北京 9:00-11:59 (Mon-Fri)
    - cron: "32 1 * * 1-5"       # 北京 9:32 开盘2分钟后硬刷新（盘中）
    - cron: "*/15 5-6 * * 1-5"   # 北京 13:00-14:59 (Mon-Fri)
    - cron: "10 7 * * 1-5"       # 北京 15:10 (Mon-Fri)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore K-line cache
        id: cache
        uses: actions/cache@v4
        with:
          path: data/kline_cache.parquet
          key: kline-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kline-v2-

      - name: Seed cache if missing
        run: |
          if [ ! -f data/kline_cache.parquet ]; then
            echo "Cache missing, restoring from seed"
            cp data/kline_cache_seed.parquet data/kline_cache.parquet
          fi

      - name: Determine mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            export TZ=Asia/Shanghai
            H=$(date +%H)
            M=$(date +%M)
            if [ "$H" = "15" ] && [ "$M" -le 30 ]; then
              MODE=close
            else
              MODE=intraday
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running mode: $MODE"

      - name: Refresh data
        run: python scripts/refresh.py --mode ${{ steps.mode.outputs.mode }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/rps.json data/history.json data/fip.json data/meta.json data/sector_rps.json data/sector_rps_history.json data/cloud_run_log.json
          git commit -m "auto: ${{ steps.mode.outputs.mode }} refresh $(TZ=Asia/Shanghai date +%F_%H:%M)" || echo "No changes to commit"
          git push
